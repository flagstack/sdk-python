[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "switchonyourcode"
version = "0.0.0"
description = "Official Python SDK for SwitchOnYourCode feature flags."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Switch On Your Code" },
]
keywords = ["feature-flags", "feature-toggles", "switchonyourcode"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
openfeature = ["openfeature-sdk>=0.10,<0.11"]

[project.urls]
Homepage = "https://github.com/switchonyourcode/switchonyourcode"
Repository = "https://github.com/switchonyourcode/sdk-python"
Issues = "https://github.com/switchonyourcode/sdk-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchonyourcode = ["py.typed"]
